<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>ASW/SUW WTI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#090a0f] text-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-[#12141c] border border-red-900/40 p-8 rounded-lg shadow-2xl w-full max-w-md space-y-6">
        <div class="text-center">
            <h1 class="text-xl font-extrabold text-white uppercase tracking-wider">ASW/SUW WTI <span class="text-red-600">Gradebook</span></h1>
            <p class="text-xs text-gray-400 font-mono mt-1">RESTRICTED ACCESS — AUTHORIZED PERSONNEL ONLY</p>
        </div>
        
        {% if error %}
        <div class="bg-red-950/50 border border-red-900 text-red-400 text-xs p-3 rounded text-center">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-mono uppercase text-gray-400 mb-1">Access Password</label>
                <input type="password" name="password" required class="w-full bg-[#090a0f] border border-gray-700 rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-red-600">
            </div>
            <button type="submit" class="w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-2 rounded text-sm transition-all shadow">
                Authenticate & Enter
            </button>
        </form>
    </div>
</body>
</html>
